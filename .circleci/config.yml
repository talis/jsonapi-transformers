version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  default_executor:
    working_directory: ~/jsonapi-transformers
    docker:
      - image: cimg/node:24.18.0
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD

jobs:
  build_and_test:
    executor: default_executor
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Define environment variable with lastest commit's message
          command: |
            echo 'export COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Lint commit message
          command: echo "$COMMIT_MESSAGE" | npx commitlint
      - run:
          name: Run linters
          command: npm run lint
      - run:
          name: Ensure the JSON:API examples are validated against the JSON:API schema
          command: npm run validate_jsonapi_examples
      - run:
          name: Run unit tests
          command: npm run test
      - store_artifacts:
          path: coverage
      - run:
          name: Rebuild the release directory (lib/)
          command: npm run build

workflows:
  test:
    jobs:
      - build_and_test:
          context:
            - docker-hub-secrets
